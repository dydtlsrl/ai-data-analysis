<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 09 - 함수, 배열, 객체 실습</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>회원 데이터 관리 실습</h1>

        <!-- 함수 실습 영역 -->
        <div class="greet-form">
            <input type="text" id="name-input" placeholder="이름을 입력하세요">
            <button id="greet-btn">확인</button>
        </div>
        <div id="greeting-box"></div>

        <!-- map() 실습 영역 -->
        <h2>전체 회원 목록 (map)</h2>
        <ul id="user-list"></ul>

        <!-- filter() 실습 영역 -->
        <h2>활동 중인 회원 (filter)</h2>
        <ul id="active-user-list"></ul>
    </div>

    <!-- JavaScript 파일 연결 -->
    <script src="script.js"></script>
</body>
</html>
